[project]
name = "f1"
version = "0.1.0"
description = "Pipeline de engenharia de dados para dados históricos de Fórmula 1 via OpenF1."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "httpx>=0.28,<1.0",
    "streamlit>=1.66.1,<2.0.0",
    "plotly>=6.0,<7.0",
]

[tool.poetry]
packages = [{ include = "f1", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.13"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.14"
taskipy = "^1.14.1"
pre-commit = "^4.7.0"

[tool.taskipy.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff check . --fix && ruff format ."
docs = "mkdocs build --strict"
check = "ruff check . && pytest && mkdocs build --strict"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=f1 --cov-report=term-missing --cov-fail-under=50"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
